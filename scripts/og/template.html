<!doctype html>
<!--
  OGP 画像（1200×630）のテンプレート。scripts/og/render.js が ?page=<key> を付けて開き、スクリーンショットを撮る。
  サイトと同じ記号系: 白地 + 水色の輪 + 細い同心円 + IBM Plex Sans JP。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&display=block">
<style>
  :root { --brand: #6ccaf1; --ink: #10181f; --sub: #5a6672; --m: 72px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #fff; overflow: hidden; }
  body { position: relative; color: var(--ink); font-family: "IBM Plex Sans JP", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; }
  svg { position: absolute; inset: 0; }
  .logo { position: absolute; left: var(--m); top: 60px; display: flex; align-items: center; gap: 12px; font: 600 30px/1 "IBM Plex Sans", sans-serif; }
  .logo i { width: 30px; height: 30px; border-radius: 50%; border: 5px solid var(--brand); }
  .label { position: absolute; left: var(--m); top: 236px; display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 500; color: var(--sub); letter-spacing: .1em; }
  .label::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--brand); }
  h1 { position: absolute; left: var(--m); top: 280px; font-weight: 500; line-height: 1.38; letter-spacing: .05em; white-space: nowrap; }
  .sub { position: absolute; left: var(--m); bottom: 68px; font-size: 22px; color: var(--sub); letter-spacing: .04em; line-height: 1.7; }
  .url { position: absolute; right: var(--m); bottom: 70px; font: 500 20px/1 "IBM Plex Sans", sans-serif; letter-spacing: .06em; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 630" id="bg"></svg>
<div class="logo"><i></i>Linkle</div>
<div class="label" id="label"></div>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div class="url">linkle.group</div>
<script>
  const PAGES = {
    home:         { label: 'システム開発会社', title: ['システムに、', '仕事を合わせない。'], size: 78, top: 196, sub: '業務システム開発 / FDE / DX支援 / Web制作', rings: [[960, 330, 300, .62, 1], [1180, 60, 180, .62, .5]] },
    service:      { label: '事業内容', title: ['業務システム開発・FDE・', 'DX支援・Web制作'], size: 54, sub: '要件の整理から運用まで、自社で一貫して', rings: [[900, 300, 150, .6, 1], [1000, 300, 150, .6, .6], [1100, 300, 150, .6, .38], [1200, 300, 150, .6, .22]] },
    construction: { label: '注力領域', title: ['建設業向け', 'システム開発'], size: 74, sub: '手配・材料・請求を、一つの業務システムに', rings: [[980, 300, 290, .87, 1], [980, 300, 200, .82, .75], [980, 300, 98, 0, 1]] },
    works:        { label: '開発事例', title: ['専門工事会社の', '業務システム'], size: 66, sub: '事務作業を、1日4時間減らしました', rings: [[980, 300, 270, .9, 1], [980, 300, 170, .62, .6]] },
    about:        { label: '会社概要', title: ['Linkle株式会社'], size: 76, sub: '2025年1月設立 / 東京・池袋', rings: [[980, 310, 270, .62, 1], [1170, 70, 150, .62, .45]] },
    recruit:      { label: '採用情報', title: ['使う人の近くで、', 'つくる。'], size: 72, sub: 'エンジニア・デザイナーを募集しています', rings: [[920, 310, 200, .62, 1], [1050, 310, 200, .62, .5], [1180, 310, 200, .62, .25]] },
    news:         { label: 'ニュース', title: ['Linkleからの', 'お知らせ'], size: 72, sub: 'お知らせ / リリース / メディア掲載', rings: [[990, 310, 250, .62, 1], [780, 120, 60, .62, .4]] },
    contact:      { label: 'お問い合わせ', title: ['今の業務の話を、', '聞かせてください。'], size: 66, sub: 'ご相談・無料見本のご依頼はこちらから', rings: [[1010, 250, 260, .62, 1], [1170, 520, 150, .62, .45]] },
  };
  const key = new URLSearchParams(location.search).get('page') || 'home';
  const P = PAGES[key];
  document.getElementById('label').textContent = P.label;
  const h = document.getElementById('title');
  h.style.fontSize = P.size + 'px'; h.innerHTML = P.title.join('<br>');
  if (P.title.length === 1) h.style.top = '300px';
  document.getElementById('sub').textContent = P.sub;
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('bg');
  const [cx, cy] = P.rings[0];
  for (let k = 1; k <= 26; k++) {
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', k * 46);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', `rgba(31,111,147,${0.2 * Math.pow(1 - k / 27, 1.5)})`); svg.appendChild(c);
  }
  P.rings.forEach(([x, y, R, k, o]) => {
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', R * (1 + k) / 2);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#6ccaf1'); c.setAttribute('stroke-width', R * (1 - k)); c.style.opacity = o; c.style.mixBlendMode = 'multiply'; svg.appendChild(c);
  });
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
