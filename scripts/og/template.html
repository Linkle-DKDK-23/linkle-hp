<!doctype html>
<!--
  OGP 画像（1200×630）のテンプレート。scripts/og/render.js が ?page=<key> を付けて開き、スクリーンショットを撮る。
  サイトの記号系をそのまま使う: 黒面 + 方眼 + 十字 + シグナル・リッジ（隠線処理つきの水平線）+ Bungee の巨大文字 + DotGothic16 のタグライン。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=DotGothic16&family=Bungee&display=block">
<style>
  :root { --brand: #6ccaf1; --ink: #f0f1fa; --dim: rgba(255,255,255,.42); --m: 64px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body { position: relative; color: var(--ink); font-family: "DotGothic16", sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(to right, rgba(255,255,255,.09) 0 1px, transparent 1px 268px),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.09) 0 1px, transparent 1px 268px),
      repeating-linear-gradient(to right, rgba(255,255,255,.045) 0 1px, transparent 1px 33.5px),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 33.5px);
    background-position: 64px 0, 0 47px, 64px 0, 0 47px;
  }
  .cross { position: absolute; width: 15px; height: 15px; transform: translate(-50%, -50%); }
  .cross::before, .cross::after { content: ""; position: absolute; background: rgba(255,255,255,.55); }
  .cross::before { left: 7px; top: 0; width: 1px; height: 15px; }
  .cross::after { top: 7px; left: 0; height: 1px; width: 15px; }
  .logo { position: absolute; left: var(--m); top: 52px; font: 700 26px/1 "Chakra Petch", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .sheet { position: absolute; left: var(--m); top: 92px; font-size: 15px; color: var(--dim); letter-spacing: .06em; }
  .chip { position: absolute; right: var(--m); top: 46px; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 20px; border-radius: 999px; background: #22272b; font: 700 15px/1 "Chakra Petch", sans-serif; letter-spacing: .06em; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 12px var(--brand); }
  .title { position: absolute; left: calc(var(--m) - 6px); bottom: 150px; font-family: "Bungee", sans-serif; line-height: .86; text-transform: uppercase; white-space: nowrap; }
  .title .dim { position: absolute; top: -26px; left: 6px; right: 0; height: 9px; border-left: 1px solid var(--dim); border-right: 1px solid var(--dim); }
  .title .dim::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: var(--dim); }
  .title .dim span { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: #000; padding: 0 8px; font-size: 13px; color: var(--dim); }
  .tag { position: absolute; left: var(--m); bottom: 62px; font-size: 27px; line-height: 1.4; }
  .tag b { font-weight: 400; color: var(--brand); }
  .num { position: absolute; left: 22px; font-size: 12px; color: var(--dim); }
  .meta { position: absolute; right: var(--m); bottom: 62px; text-align: right; font-size: 17px; line-height: 1.6; color: rgba(240,241,250,.82); }
  .meta .url { font: 700 19px/1 "Chakra Petch", sans-serif; letter-spacing: .06em; color: var(--ink); display: inline-flex; align-items: center; gap: 12px; }
  .meta .url::before { content: ""; width: 56px; height: 2px; background: linear-gradient(90deg, rgba(108,202,241,0), var(--brand)); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--brand) 0 22%, rgba(108,202,241,.25) 22% 100%); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 90% at 30% 70%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
</style>
</head>
<body>
<canvas id="c" width="2400" height="1260" style="width:1200px;height:630px"></canvas>
<div class="grid"></div>
<div class="vig"></div>
<div id="crosses"></div>
<div class="logo">Linkle</div>
<div class="sheet" id="sheet"></div>
<div class="chip"><i></i><span id="chip"></span></div>
<div class="title" id="title"><div class="dim"><span id="dimlabel"></span></div><div id="titleText"></div></div>
<div class="tag" id="tag"></div>
<div class="meta"><div id="desc"></div><div class="url">linkle.group</div></div>
<div class="bar"></div>
<script>
  const PAGES = {
    home:    { sheet: '001', chip: 'WEB / SYSTEM / DX', title: ['Linkle'], size: 196, tag: ['速く、美しく、<b>見つかる。</b>', 'ホームページ制作・Webシステム開発'], desc: ['Linkle株式会社', '東京・池袋'] },
    about:   { sheet: '002', chip: 'COMPANY', title: ['About us'], size: 150, tag: ['会社概要', '速く、美しく、<b>見つかる</b>Webで。'], desc: ['Linkle株式会社', '2025年1月設立 / 東京・池袋'] },
    service: { sheet: '003', chip: 'OUR BUSINESS', title: ['Service'], size: 168, tag: ['サービス', 'ホームページ制作 / Webシステム開発 / <b>業務効率化支援</b>'], desc: ['Linkle株式会社', '要件定義から運用まで一気通貫'] },
    news:    { sheet: '004', chip: "WHAT'S NEW", title: ['News'], size: 196, tag: ['ニュース', 'Linkleの「<b>いま</b>」をお届けします。'], desc: ['Linkle株式会社', 'お知らせ / リリース / メディア'] },
    recruit: { sheet: '005', chip: 'JOIN US', title: ['Recruit'], size: 168, tag: ['採用情報', '勢いのあるチームで、<b>本気でつくろう。</b>'], desc: ['Linkle株式会社', 'エンジニア / デザイナー募集'] },
    contact: { sheet: '006', chip: "LET'S TALK", title: ['Contact'], size: 168, tag: ['お問い合わせ', 'ご相談・お見積りは<b>無料</b>です。'], desc: ['Linkle株式会社', 'まずは、話すところから。'] },
  };
  const key = new URLSearchParams(location.search).get('page') || 'home';
  const P = PAGES[key];
  document.getElementById('sheet').textContent = `[[ ${P.sheet} ]]`;
  document.getElementById('chip').textContent = P.chip;
  const tt = document.getElementById('titleText');
  tt.style.fontSize = P.size + 'px';
  tt.innerHTML = P.title.join('<br>');
  document.getElementById('tag').innerHTML = P.tag.map((t, i) => `<div style="position:relative">${i === 0 ? `<span style="font-size:18px;color:rgba(240,241,250,.7);letter-spacing:.08em">${t}</span>` : t}</div>`).join('');
  document.getElementById('desc').innerHTML = P.desc.join('<br>');

  // 十字（方眼の主線交点の一部）
  const cr = document.getElementById('crosses');
  [[64 + 268, 47 + 268], [64 + 268 * 2, 47 + 268], [64 + 268 * 3, 47 + 268], [64 + 268 * 3, 47]].forEach(([x, y]) => {
    const d = document.createElement('div'); d.className = 'cross'; d.style.left = x + 'px'; d.style.top = y + 'px'; cr.appendChild(d);
  });

  // シグナル・リッジ（signalMaterial.js と同じ考え方を Canvas2D で）
  function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
  function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (hash(i) * (1 - u) + hash(i + 1) * u) * 2 - 1; }
  function noise2(x, y) { return noise1(x + noise1(y * 1.7) * 3.1 + y * 13.37); }
  const seed = { home: 0.0, about: 7.3, service: 3.1, news: 11.2, recruit: 5.6, contact: 9.4 }[key];
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  g.scale(2, 2);
  const W = 1200, H = 630, LINES = 58, SP = 7.4, Y0 = H + 16, MAXH = 330;
  const peakX = { home: 0.66, about: 0.72, service: 0.7, news: 0.74, recruit: 0.68, contact: 0.72 }[key];
  const ridge = (x, i) => {
    const px = x / W, ax = (px - 0.5) * 1.9;
    const dc = (px - peakX) * 1.9;
    const env = Math.exp(-dc * dc * 4.2) * Math.max(0, 1 - i / LINES * 1.1);
    let n = noise2(ax * 2.6 + i * 0.13 + seed, i * 0.29 + seed) + 0.35 * noise2(ax * 5.6 + seed, i * 0.53 + 3.1);
    n = Math.max(0, n * 0.7 + 0.12);
    const bump = Math.exp(-Math.pow((px - peakX) * 1.9, 2) * 30) * Math.exp(-Math.pow((i - 12) / 8, 2)) * 0.75;
    return env * n * n * 0.9 + bump + 0.01 * noise2(ax * 18, i * 1.7);
  };
  // 奥（上）の線から描き、手前の線は下を黒で塗りつぶして奥を隠す
  for (let i = LINES - 1; i >= 0; i--) {
    const base = Y0 - i * SP;
    const pts = [];
    for (let x = 0; x <= W; x += 3) pts.push([x, base - MAXH * ridge(x, i)]);
    g.beginPath(); g.moveTo(0, H); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W, H); g.closePath();
    g.fillStyle = '#000'; g.fill();
    const depth = 1 - i / LINES;
    for (let k = 1; k < pts.length; k++) {
      const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
      const crest = Math.min(1, Math.max(0, (base - y1) / MAXH));
      const hot = Math.min(1, Math.max(0, (crest - 0.12) / 0.6));
      const edge = Math.min(1, x1 / 80, (W - x1) / 80);
      const a = (0.08 + 0.26 * depth + 0.6 * hot) * edge;
      const r = Math.round(210 + (108 - 210) * hot), gg = Math.round(220 + (202 - 220) * hot), b = Math.round(230 + (241 - 230) * hot);
      g.strokeStyle = `rgba(${r},${gg},${b},${a})`;
      g.lineWidth = 1 + hot * 0.6;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
  }
  // 文字の下だけ線を沈める
  const fade = g.createLinearGradient(0, 0, 700, 0);
  fade.addColorStop(0, 'rgba(0,0,0,.6)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade; g.fillRect(0, 0, 700, H);

  document.fonts.ready.then(() => {
    const w = tt.getBoundingClientRect().width;
    document.getElementById('dimlabel').textContent = `${Math.round(w)} px`;
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
